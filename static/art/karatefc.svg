<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1d1c19">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e4dfd2" stroke-width="1"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 10 5 0 9z" fill="#1d1c19"/></marker>
  </defs>
  <rect width="800" height="600" fill="#f7f5ee"/>
  <rect width="800" height="600" fill="url(#g)"/>

  <!-- board: 36 x 36 mm at 9 px/mm, 30.5 mm hole pattern -->
  <rect x="138" y="138" width="324" height="324" rx="22" fill="#14532d" stroke="#1d1c19" stroke-width="2"/>
  <g fill="#c58b2b" stroke="#8a6220" stroke-width="1">
    <circle cx="163" cy="163" r="16"/><circle cx="437" cy="163" r="16"/><circle cx="163" cy="437" r="16"/><circle cx="437" cy="437" r="16"/>
  </g>
  <g fill="#f7f5ee"><circle cx="163" cy="163" r="9"/><circle cx="437" cy="163" r="9"/><circle cx="163" cy="437" r="9"/><circle cx="437" cy="437" r="9"/></g>

  <!-- LQFP64 -->
  <rect x="245" y="245" width="110" height="110" fill="#222" stroke="#000"/>
  <g stroke="#c9c9c9" stroke-width="2">
    <path d="M253 240v-8M261 240v-8M269 240v-8M277 240v-8M285 240v-8M293 240v-8M301 240v-8M309 240v-8M317 240v-8M325 240v-8M333 240v-8M341 240v-8M349 240v-8"/>
    <path d="M253 360v8M261 360v8M269 360v8M277 360v8M285 360v8M293 360v8M301 360v8M309 360v8M317 360v8M325 360v8M333 360v8M341 360v8M349 360v8"/>
    <path d="M240 253h-8M240 261h-8M240 269h-8M240 277h-8M240 285h-8M240 293h-8M240 301h-8M240 309h-8M240 317h-8M240 325h-8M240 333h-8M240 341h-8M240 349h-8"/>
    <path d="M360 253h8M360 261h8M360 269h8M360 277h8M360 285h8M360 293h8M360 301h8M360 309h8M360 317h8M360 325h8M360 333h8M360 341h8M360 349h8"/>
  </g>
  <circle cx="256" cy="256" r="3" fill="#777"/>
  <text x="300" y="296" text-anchor="middle" fill="#d9d9d9" font-size="12">STM32</text>
  <text x="300" y="314" text-anchor="middle" fill="#d9d9d9" font-size="12">F405</text>

  <!-- USB-C at edge -->
  <rect x="270" y="440" width="60" height="26" rx="10" fill="#bfbfbf" stroke="#1d1c19" stroke-width="1.5"/>
  <!-- motor / ESC pads -->
  <g fill="#c58b2b">
    <rect x="200" y="160" width="26" height="14" rx="3"/><rect x="374" y="160" width="26" height="14" rx="3"/>
    <rect x="200" y="426" width="26" height="14" rx="3"/><rect x="374" y="426" width="26" height="14" rx="3"/>
  </g>
  <g fill="#f4f1e6" font-size="11"><text x="206" y="192">M1</text><text x="380" y="192">M2</text><text x="206" y="418">M3</text><text x="380" y="418">M4</text></g>
  <text x="152" y="300" fill="#f4f1e6" font-size="11" transform="rotate(-90 152 300)">KarateFC</text>

  <!-- dims -->
  <g stroke="#1d1c19" stroke-width="1" fill="none">
    <path d="M163 120V100M437 120V100M163 108H437" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M120 163H100M120 437H100M108 163V437" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <text x="300" y="96" text-anchor="middle">30.5</text>
  <text x="92" y="300" text-anchor="middle" transform="rotate(-90 92 300)">30.5</text>

  <!-- callouts -->
  <g font-size="13">
    <path d="M370 300H520" stroke="#1d1c19" stroke-width="1"/><text x="528" y="304">STM32F405, LQFP64</text>
    <path d="M330 452H520" stroke="#1d1c19" stroke-width="1"/><text x="528" y="456">USB-C, Betaflight config</text>
    <path d="M400 167H520" stroke="#1d1c19" stroke-width="1"/><text x="528" y="171">motor outputs</text>
    <path d="M453 163H520V230" stroke="#1d1c19" stroke-width="1" fill="none"/><text x="528" y="234">M3 holes, 30.5 mm pattern</text>
  </g>
  <g stroke="#1d1c19" stroke-width="1.5" fill="none"><rect x="508" y="500" width="252" height="70"/></g>
  <text x="520" y="526" font-weight="bold">CONCEPT SKETCH</text>
  <text x="520" y="548" font-size="11" fill="#5f5b52">not a real layout yet · mm</text>
</svg>
